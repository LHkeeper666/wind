[package]
name = "wind"
version = "0.1.0"
description = "Wind - A vim-driven file workstation for Windows"
authors = ["lhkeeper"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
log = "0.4"
fern = "0.7"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
windows = { version = "0.62.2", features = ["Win32_System_Console", "Win32_Foundation", "Win32_UI_Input_Ime", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry"] }
regex = "1"
tokio = { version = "1", features = ["rt", "io-util", "fs", "rt-multi-thread", "process", "time"] }
base64 = "0.22"
zip = "2"
image = "0.25"
turbojpeg = "1.4"
fast_image_resize = "5"
pdfium-render = { version = "0.8", features = ["pdfium_latest", "sync", "thread_safe"] }
portable-pty = "0.8"
tiny_http = "0.12"
trash = "4"
open = "5"
notify = "6"
suppaftp = { version = "8", default-features = false, features = ["tokio-rustls-aws-lc-rs"] }
chardetng = "0.1"
encoding_rs = "0.8"
tar = "0.4"
flate2 = "1"
sevenz-rust = { version = "0.6", features = ["aes256"] }
